# Builds the engine, the desktop app and gh-data on Linux, Windows and macOS,
# runs the test suites on Linux, and on a version tag (v0.2.0, ...) publishes
# the packages as a GitHub release: an AppImage and portable tar.gz, a
# Windows zip, a macOS dmg. Each job runs the same script a developer would
# run locally (packaging/).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt 5 and the AppImage tooling prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qt5-qmake qtbase5-dev-tools \
              libgl1-mesa-dev libfuse2 file
      - name: Build (top-level qmake project)
        run: make build
      - name: Engine unit tests
        run: make -C c test
      - name: Qt unit tests
        run: make qt-test
      - name: Package (AppImage + portable tar.gz)
        run: packaging/linux-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  # The sequencing tools the Windows zip ships in tools\: samtools, bcftools
  # and minimap2 built from their release tarballs in MSYS2 MinGW64, the
  # environment their own projects test Windows builds in. Linux and macOS
  # users install them from apt/Homebrew instead (the app says how).
  windows-tools:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-zlib mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-xz mingw-w64-x86_64-libdeflate mingw-w64-x86_64-curl-winssl
            mingw-w64-x86_64-isa-l mingw-w64-x86_64-highway
            make autoconf automake tar
      - name: Build samtools, bcftools, minimap2
        run: packaging/windows-tools.sh
      # Outside the MSYS2 shell, as the app will run them: proves the DLL set
      # is complete and that https:// works through htslib's libcurl.
      - name: Smoke test from a plain Windows shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $PWD packaging/tools/windows
          # In a scratch directory: htslib caches remote .tbi/.fai/.gzi
          # indexes in the working directory, and they must not ship.
          Set-Location $env:RUNNER_TEMP
          & $t\samtools.exe --version | Select-Object -First 1
          & $t\bcftools.exe --version | Select-Object -First 1
          & $t\minimap2.exe --version
          if (Test-Path $t\fastp.exe) { & $t\fastp.exe --version } else { Write-Host "fastp not built" }
          & $t\samtools.exe faidx https://ftp.ebi.ac.uk/pub/ensemblorganisms/GCA/000/001/405/14/ensembl/2013_09/genome/unmasked.fa.bgz 19:45411941-45411941
          & $t\bcftools.exe view -H -r 22:16050075 https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/release/20130502/ALL.chr22.phase3_shapeit2_mvncall_integrated_v5b.20130502.genotypes.vcf.gz | ForEach-Object { $_.Substring(0, 60) }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-tools
          path: packaging/tools/windows/**

  windows:
    runs-on: windows-2022
    needs: windows-tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-tools
          path: packaging/tools/windows
      # Qt 6 on Windows carries a native Schannel TLS backend, so HTTPS
      # (ClinVar, Ensembl, 1000 Genomes) needs no OpenSSL DLLs; Qt 5.15 can
      # only load OpenSSL 1.1, which Qt no longer distributes.
      - name: Install Qt 6.8 (MinGW 64-bit kit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true
      - name: Put the MinGW toolchain on PATH
        shell: pwsh
        run: echo "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build and package
        shell: cmd
        run: packaging\windows-package.bat
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  macos:
    # Apple-silicon runner; Qt 5.15.2's macOS build is x86_64-only, so the
    # script builds x86_64 (Rosetta at run time on Apple silicon).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          cache: true
      - name: Build and package
        run: packaging/macos-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Only the packages: the windows-tools artifact is an input to the
      # Windows zip, not a release asset.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/linux/*
            artifacts/windows/*
            artifacts/macos/*
          generate_release_notes: true
